<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Miggle is a daily word ladder. Change one letter, shuffle, and climb your way to MIGUEL."
    />
    <meta name="theme-color" content="#fbf6ee" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#16121b" media="(prefers-color-scheme: dark)" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🥸</text></svg>"
    />
    <title>Miggle</title>
  </head>
  <body>
    <header class="site-header">
      <h1 class="wordmark">MIGGLE</h1>
      <p class="tagline">A daily word ladder to MIGUEL</p>

    <main class="site-main">
      <div id="board" class="board" role="group" aria-label="Game board"></div>
      <p class="board-note">Today's puzzle is on its way.</p>
    </main>

    <footer class="site-footer">
      <p>Miggle 🥸 · Change one letter, shuffle, repeat.</p>
    </footer>

    <script type="module" src="/src/main.ts"></script>
