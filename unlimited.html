<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Endless Miggle word ladders to MIGUEL. Pick Easy, Medium or Hard, earn hints and build a streak."
    />
    <link rel="canonical" href="%VITE_SITE_URL%/unlimited.html" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Miggle" />
    <meta property="og:title" content="Miggle Unlimited: endless word ladders to MIGUEL" />
    <meta
      property="og:description"
      content="Endless Miggle word ladders to MIGUEL. Pick Easy, Medium or Hard, earn hints and build a streak."
    />
    <meta property="og:url" content="%VITE_SITE_URL%/unlimited.html" />
    <meta property="og:image" content="%VITE_SITE_URL%/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="The Miggle logo beside a word ladder from CASTLE to MIGUEL"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#fbf6ee" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#16121b" media="(prefers-color-scheme: dark)" />
    <title>Miggle Unlimited: endless word ladders to MIGUEL</title>
  </head>
  <body class="game-page">
    <header class="site-header">
      <div class="header-side">
        <button type="button" class="icon-btn" data-action="help" aria-label="How to play">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="9" />
            <path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6v.6" />
            <circle cx="12" cy="17.2" r=".6" class="fill" />
          </svg>
        </button>
        <button type="button" class="icon-btn" data-action="settings" aria-label="Settings">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 6h9M19 6h1M4 12h3M11 12h9M4 18h11M19 18h1" />
            <circle cx="16" cy="6" r="2.5" />
            <circle cx="9" cy="12" r="2.5" />
            <circle cx="17" cy="18" r="2.5" />
          </svg>
        </button>
      </div>
      <h1 class="wordmark">MIGGLE</h1>
      <div class="header-side header-side--end">
        <button type="button" class="icon-btn" data-action="stats" aria-label="Statistics" disabled>
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M5 20V11M12 20V5M19 20v-6" />
          </svg>
        </button>
      </div>
    </header>

    <nav class="mode-tabs" aria-label="Game mode">
      <a href="./">Daily</a>
      <a href="./unlimited.html" aria-current="page">Unlimited</a>
      <a href="./answers/">Answers</a>
    </nav>

    <main class="site-main game-shell">
      <div class="unlimited-bar">
        <div class="segmented" role="group" aria-label="Difficulty">
          <button type="button" data-difficulty="easy" aria-pressed="false" disabled>Easy</button>
          <button type="button" data-difficulty="medium" aria-pressed="false" disabled>
            Medium
          </button>
          <button type="button" data-difficulty="hard" aria-pressed="false" disabled>Hard</button>
        </div>
        <p class="run-streak" title="Streak">
          <span aria-hidden="true">🔥</span><span class="sr-only">Streak</span>
          <strong data-ref="streak">0</strong>
        </p>
        <button type="button" class="btn btn--ghost btn--small" data-ref="giveUp" disabled>
          Give up
        </button>
      </div>
      <div id="game" class="game">
        <p class="status-message">Loading…</p>
      </div>
    </main>

    <noscript>
      <p class="status-message">
        Miggle needs JavaScript to play. You can still read
        <a href="./how-to-play.html">how to play</a> or browse
        <a href="./answers/">past answers</a>.
      </p>
    </noscript>

    <script type="module" src="/src/unlimited.ts"></script>
  </body>
</html>
